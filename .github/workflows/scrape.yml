name: HSR Cenu Radara Skenēšana

on:
  schedule:
    # Automātiski palaižas katru rītu plkst. 05:00 UTC (LV rītā ~07:00 vai 08:00)
    - cron: '0 5 * * *'
  # Poga, lai jebkurā brīdī varētu palaist ar roku pārbaudei:
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Ļauj robotam ierakstīt jaunās cenas atpakaļ repozitorijā

    steps:
      - name: 1. Lejupielādē kodu
        uses: actions/checkout@v4

      - name: 2. Sagatavo Python vidi
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Instalē nepieciešamās bibliotēkas
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: 4. Palaiž cenu vākšanas skriptu
        run: |
          python scraper.py

      - name: 5. Saglabā jauno scraped_data.json failu
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automātisks cenu atjauninājums [skip ci]"
          file_pattern: "scraped_data.json"
          commit_user_name: "HSR Radar Bot"
          commit_user_email: "actions@github.com"
