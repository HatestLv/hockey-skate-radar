<!DOCTYPE html>
<html lang="lv" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hockey Skate Radar | Cenu un Pieejamības Salīdzināšana</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #0b1120;
      --bg-surface: #131d33;
      --bg-card: #182440;
      --border-color: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(239, 68, 68, 0.4);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-red: #e11d48;
      --accent-green: #22c55e;
      --accent-amber: #f59e0b;
      --font-main: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --shadow-card: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    [data-theme="light"] {
      --bg-base: #f8fafc;
      --bg-surface: #ffffff;
      --bg-card: #f1f5f9;
      --border-color: rgba(0, 0, 0, 0.08);
      --border-accent: rgba(225, 29, 72, 0.3);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --shadow-card: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-main);
      background-color: var(--bg-base);
      color: var(--text-main);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    header {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-inner {
      max-width: 1380px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-main);
    }
    .brand-logo-img {
      height: 36px;
      width: auto;
      display: block;
    }
    .brand-text h1 {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      text-transform: uppercase;
    }
    .brand-text h1 span { color: var(--accent-red); }
    .brand-text p {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
    }
    .btn-icon {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 38px;
      height: 38px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      transition: all 0.2s;
    }
    .btn-icon:hover {
      border-color: var(--accent-red);
      transform: translateY(-1px);
    }

    /* DROPDOWN MENU */
    .menu-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      width: 210px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      padding: 6px;
      display: none;
      flex-direction: column;
      z-index: 200;
      animation: fadeIn 0.15s ease-out;
    }
    .menu-dropdown.active { display: flex; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
      transition: background 0.15s;
    }
    .menu-item:hover {
      background: var(--bg-card);
      color: var(--accent-red);
    }

    /* CONTAINER & TOOLBAR (VIENĀ LĪNIJĀ) */
    .main-wrap {
      max-width: 1380px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 20px 60px;
      flex: 1;
    }

    .toolbar-bar {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px 16px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .toolbar-bar::-webkit-scrollbar { display: none; }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }
    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .profile-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(225, 29, 72, 0.08);
      border: 1px solid var(--border-accent);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .profile-pill:hover {
      background: rgba(225, 29, 72, 0.16);
      border-color: var(--accent-red);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
    }
    .pill-action {
      color: var(--accent-red);
      font-weight: 700;
      margin-left: 4px;
    }

    .toolbar-divider {
      width: 1px;
      height: 24px;
      background: var(--border-color);
    }

    .filter-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .filter-select {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      outline: none;
      cursor: pointer;
      max-width: 160px;
    }
    .filter-checkbox {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
      font-size: 0.82rem;
      color: var(--text-main);
    }
    .filter-checkbox input { accent-color: var(--accent-red); cursor: pointer; }

    .view-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .view-btn.active {
      border-color: var(--accent-red);
      background: rgba(225, 29, 72, 0.12);
      color: var(--accent-red);
    }

    /* SYNC STATS */
    .sync-stats {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .sync-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(34, 197, 94, 0.1);
      color: var(--accent-green);
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 700;
      font-family: var(--font-mono);
      font-size: 0.72rem;
    }

    /* CARDS GRID */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    @media (max-width: 1080px) {
      .cards-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 720px) {
      .cards-grid { grid-template-columns: 1fr; }
    }

    .skate-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-card);
      transition: transform 0.2s, border-color 0.2s;
    }
    .skate-card:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.2);
    }
    .card-img-wrap {
      background: var(--bg-card);
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--border-color);
      height: 220px;
    }
    .card-img-wrap img {
      max-height: 170px;
      max-width: 100%;
      object-fit: contain;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
    }

    .card-body {
      padding: 18px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .card-header-meta {
      margin-bottom: 14px;
    }
    .card-title {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 4px;
    }
    .card-retailer-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .retailer-pill {
      font-weight: 600;
      color: var(--text-main);
    }
    .status-tag {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      font-family: var(--font-mono);
    }
    .tag-verified { background: rgba(34, 197, 94, 0.15); color: var(--accent-green); }
    .tag-unverified { background: rgba(148, 163, 184, 0.15); color: var(--text-muted); }

    .specs-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 14px;
      font-size: 0.85rem;
    }
    .specs-table tr {
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }
    .specs-table td {
      padding: 6px 0;
    }
    .specs-table td:first-child {
      color: var(--text-muted);
    }
    .specs-table td:last-child {
      text-align: right;
      font-weight: 600;
    }

    .price-val {
      font-size: 1.25rem;
      font-family: var(--font-mono);
      font-weight: 700;
    }
    .price-old {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-decoration: line-through;
      margin-left: 6px;
    }
    .stock-in { color: var(--accent-green); }
    .stock-out { color: var(--accent-amber); }

    /* POSITION / COMPATIBILITY METER (BEZ DEMO) */
    .compat-box {
      margin-top: auto;
      background: var(--bg-card);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 14px;
    }
    .compat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      margin-bottom: 6px;
    }
    .compat-tag {
      background: rgba(225, 29, 72, 0.2);
      color: #fb7185;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .compat-score {
      font-family: var(--font-mono);
      font-weight: 700;
    }
    .compat-bar {
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 6px;
    }
    .compat-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-amber), var(--accent-green));
      border-radius: 3px;
    }
    .compat-desc {
      font-size: 0.72rem;
      color: var(--text-muted);
      line-height: 1.3;
    }

    .btn-shop {
      display: block;
      width: 100%;
      text-align: center;
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 9px 0;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn-shop:hover {
      background: var(--accent-red);
      border-color: var(--accent-red);
      color: #fff;
    }

    /* COMPARISON TABLE */
    .cmp-wrapper {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow-x: auto;
      box-shadow: var(--shadow-card);
    }
    .cmp-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.88rem;
    }
    .cmp-table th, .cmp-table td {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-color);
    }
    .cmp-table th {
      background: var(--bg-card);
      color: var(--text-muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .cmp-model-name {
      font-weight: 700;
      color: var(--text-main);
    }
    .cmp-price-box {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .cmp-price-num {
      font-size: 1.15rem;
      font-family: var(--font-mono);
      font-weight: 700;
    }
    .cmp-stock-label {
      font-size: 0.72rem;
      font-weight: 600;
    }
    .cmp-link {
      font-size: 0.75rem;
      color: var(--accent-red);
      text-decoration: none;
      font-weight: 600;
      margin-top: 4px;
      display: inline-block;
    }
    .cmp-link:hover { text-decoration: underline; }

    /* LABĀKĀ CENA IZCELŠANA */
    .best-price-cell {
      background: rgba(34, 197, 94, 0.08) !important;
      outline: 2px solid var(--accent-green);
      outline-offset: -2px;
      border-radius: 6px;
    }
    .best-price-cell .cmp-price-num {
      color: var(--accent-green);
    }
    .best-price-badge {
      display: inline-block;
      background: var(--accent-green);
      color: #0b1120;
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      padding: 2px 6px;
      border-radius: 4px;
      margin-top: 2px;
      text-transform: uppercase;
      width: fit-content;
    }

    /* MODAL: MANS PROFILS */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.active { display: flex; }
    .modal-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 520px;
      border-radius: 14px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      overflow: hidden;
      animation: modalScale 0.2s ease-out;
    }
    @keyframes modalScale {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .modal-header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-header h3 {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .modal-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
    }
    .modal-body {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    .form-group select, .form-group input {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }
    .form-group select:focus, .form-group input:focus {
      border-color: var(--accent-red);
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .modal-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      background: var(--bg-card);
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .btn-primary {
      background: var(--accent-red);
      border: none;
      color: #fff;
      padding: 8px 20px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* FOOTER */
    footer {
      background-color: var(--bg-surface);
      border-top: 1px solid var(--border-color);
      padding: 32px 20px;
      margin-top: auto;
    }
    .footer-inner {
      max-width: 1380px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
    }
    .footer-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .footer-logo {
      height: 38px;
      width: auto;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    }
    .footer-info {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.4;
    }
    .footer-disclaimer {
      font-size: 0.72rem;
      color: var(--text-muted);
      opacity: 0.8;
      max-width: 500px;
      text-align: right;
    }
    @media (max-width: 768px) {
      .footer-inner { flex-direction: column; align-items: flex-start; }
      .footer-disclaimer { text-align: left; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-inner">
      <a href="#" class="brand">
        <img src="img/logo.svg" alt="HSR Logo" class="brand-logo-img" onerror="this.onerror=null; this.src='img/logo.png'; this.style.display='block';">
        <div class="brand-text">
          <h1>Hockey Skate <span>Radar</span></h1>
          <p>Latvijas e-veikalu cenu un pieejamības agregators</p>
        </div>
      </a>

      <div class="header-actions">
        <!-- Tēmas slēdzis -->
        <button id="theme-toggle" class="btn-icon" title="Pārslēgt dienas/nakts režīmu">🌙</button>

        <!-- Hamburger poga -->
        <button id="menu-btn" class="btn-icon" title="Izvēlne">☰</button>

        <!-- Mazā izkrītošā izvēlne -->
        <div id="menu-dropdown" class="menu-dropdown">
          <button class="menu-item" id="open-profile-btn">
            <span>👤</span> Mans profils
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN WRAP -->
  <main class="main-wrap">
